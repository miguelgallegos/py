<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>My Book Shelf</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body { background: linear-gradient(180deg,#f8fafc 0%, #eef2f6 100%); }
    .shelf { padding: 2rem 0; }
    .book-card { transition: transform .12s ease, box-shadow .12s ease; }
    .book-card:hover { transform: translateY(-6px); box-shadow: 0 10px 20px rgba(0,0,0,.08); }
    .book-spine { width: 7px; background: linear-gradient(180deg,#6c5ce7,#a29bfe); border-radius: 3px 0 0 3px; }
    .badge-attr { font-size: .72rem; }
    .controls { gap: .5rem; }
    .no-results { padding: 4rem 2rem; text-align:center; color:#6b7280; }
    .muted { color:#6b7280; }
    .view-toggle .btn { min-width: 44px; }
    .cover-img { width: 100%; height: 180px; object-fit: cover; border-radius: .25rem; background: linear-gradient(180deg,#f3f4f6,#e5e7eb); }
    .card-list { display:flex; gap:1rem; align-items:flex-start; }
    .card-list .cover-img { width: 120px; height: 160px; flex: 0 0 120px; }
  </style>
</head>
<body>
  <nav class="navbar navbar-expand-lg navbar-light bg-white border-bottom">
    <div class="container">
      <a class="navbar-brand fw-bold" href="#">📚 My Book Shelf</a>

      <div class="d-flex align-items-center ms-auto controls">
        <div class="input-group me-2">
          <span class="input-group-text">🔎</span>
          <input id="search" class="form-control" placeholder="Search by title..." aria-label="Search books">
        </div>

        <select id="sort" class="form-select me-2" style="width: 12rem;">
          <option value="title-asc">Title A→Z</option>
          <option value="title-desc">Title Z→A</option>
          <option value="avail">Availability (PDF/EPUB)</option>
        </select>

        <div class="btn-group me-2" role="group" aria-label="filters">
          <input class="form-check-input" type="checkbox" id="filterPdf">
          <label class="form-check-label muted ps-2 pe-3" for="filterPdf">PDF</label>
          <input class="form-check-input" type="checkbox" id="filterEpub">
          <label class="form-check-label muted ps-2" for="filterEpub">EPUB</label>
        </div>

        <div class="btn-group view-toggle me-2" role="group">
          <button class="btn btn-outline-secondary active" title="Grid view" data-view="grid">▦</button>
          <button class="btn btn-outline-secondary" title="List view" data-view="list">≡</button>
        </div>

        <button id="uploadBtn" class="btn btn-outline-primary" title="Upload books JSON (books.json or books-covers.json)">📁 Upload</button>
        <button id="downloadBtn" class="btn btn-outline-success">⬇️ Export</button>
      </div>
    </div>
  </nav>

  <main class="container shelf">
    <div id="stats" class="mb-3 text-muted small">Loading books...</div>

    <div id="shelfGrid" class="row g-3"></div>

    <div id="pagination" class="mt-4 d-flex justify-content-center"></div>

    <div id="noResults" class="no-results d-none">
      <h5>No books match your search.</h5>
      <p class="muted">Try clearing filters, or upload a different <code>books.json</code>.</p>
    </div>
  </main>

  <input id="fileInput" type="file" accept="application/json" style="display:none">

  <!-- Embedded books.json fallback (minified) -->
  <script>
    const EMBEDDED_BOOKS = [
      {"title":"The Art of Writing MIPS : An Unconventional Approach","pdf":"https://leanpub.com/s/2BF80040442445E1B4DE59BECBFA5402.pdf","epub":null,"other_links":[],"cover":"https://placehold.co/200x300/png?text=The+Art+of+Writing+MIPS&bg=efefef&fc=333333"},
      {"title":"AWS re:Invent 2021 Lessons","pdf":"https://leanpub.com/s/330BA4F95A644488BFE108649FC92582.pdf","epub":"https://leanpub.com/s/330BA4F95A644488BFE108649FC92582.epub","other_links":[],"cover":"https://placehold.co/200x300/png?text=AWS+re%3AInvent+2021+Lessons&bg=efefef&fc=333333"},
      {"title":"The Little Book of Little Books","pdf":"https://leanpub.com/s/4E619E4B6AC0444E9CD4B6DFD0306C25.pdf","epub":"https://leanpub.com/s/4E619E4B6AC0444E9CD4B6DFD0306C25.epub","other_links":[],"cover":"https://placehold.co/200x300/png?text=The+Little+Book+of+Little+Books&bg=efefef&fc=333333"},
      {"title":"How to be an Information Security Consultant","pdf":"https://leanpub.com/s/5BFB5380A39A481CB2E8B0317AF9F002.pdf","epub":null,"other_links":[],"cover":"https://placehold.co/200x300/png?text=How+to+be+an+Information+Security+Consultant&bg=efefef&fc=333333"},
      {"title":"Teradata Fundamentals","pdf":"https://leanpub.com/s/EBB98EE145484F12912ECB54C27350B3.pdf","epub":"https://leanpub.com/s/EBB98EE145484F12912ECB54C27350B3.epub","other_links":[],"cover":"https://placehold.co/200x300/png?text=Teradata+Fundamentals&bg=efefef&fc=333333"},
      {"title":"The Kinesis book","pdf":"https://leanpub.com/s/54C2E15A9F5449AD98B4E6379F7C6F77.pdf","epub":"https://leanpub.com/s/54C2E15A9F5449AD98B4E6379F7C6F77.epub","other_links":[],"cover":"https://placehold.co/200x300/png?text=The+Kinesis+book&bg=efefef&fc=333333"},
      {"title":"La Economía Blockchain - Manual Básico","pdf":"https://leanpub.com/s/20CBA10C893D4503985DE3556D1DD468.pdf","epub":null,"other_links":[],"cover":"https://placehold.co/200x300/png?text=La+Econom%C3%ADa+Blockchain&bg=efefef&fc=333333"},
      {"title":"Git Workflow Discipline","pdf":"https://leanpub.com/s/487872B2247F46778EE053CE1860135D.pdf","epub":"https://leanpub.com/s/487872B2247F46778EE053CE1860135D.epub","other_links":[],"cover":"https://placehold.co/200x300/png?text=Git+Workflow+Discipline&bg=efefef&fc=333333"}
    ];

    // Application state
    let allBooks = [];
    let filtered = [];
    let currentPage = 1;
    const perPage = 30;
    let viewMode = 'grid'; // 'grid' or 'list'

    // Utilities
    function byAvailability(a,b){
      const aScore = (a.pdf?1:0)+(a.epub?1:0);
      const bScore = (b.pdf?1:0)+(b.epub?1:0);
      return bScore - aScore;
    }

    function applyFilters(){
      const q = document.getElementById('search').value.trim().toLowerCase();
      const pdfOnly = document.getElementById('filterPdf').checked;
      const epubOnly = document.getElementById('filterEpub').checked;
      const sort = document.getElementById('sort').value;

      filtered = allBooks.filter(b => {
        if(q && !b.title.toLowerCase().includes(q)) return false;
        if(pdfOnly && !b.pdf) return false;
        if(epubOnly && !b.epub) return false;
        return true;
      });

      if(sort === 'title-asc') filtered.sort((a,b)=>a.title.localeCompare(b.title));
      else if(sort === 'title-desc') filtered.sort((a,b)=>b.title.localeCompare(a.title));
      else if(sort === 'avail') filtered.sort(byAvailability);

      currentPage = 1;
      render();
    }

    function render(){
      const out = document.getElementById('shelfGrid');
      const stats = document.getElementById('stats');
      const noResults = document.getElementById('noResults');

      const start = (currentPage-1)*perPage;
      const pageItems = filtered.slice(start, start+perPage);

      out.innerHTML = '';
      if(filtered.length === 0){
        noResults.classList.remove('d-none');
        stats.textContent = `0 books`; 
        document.getElementById('pagination').innerHTML = '';
        return;
      }
      noResults.classList.add('d-none');

      stats.textContent = `Showing ${start+1}–${start+pageItems.length} of ${filtered.length} books`;

      const colClass = viewMode === 'grid' ? 'col-sm-6 col-md-4 col-lg-3' : 'col-12';

      pageItems.forEach((b, i) => {
        const col = document.createElement('div'); col.className = colClass;
        col.innerHTML = `
          <div class="card book-card h-100">
            <div class="d-flex">
              <div class="book-spine d-none d-sm-block"></div>
              <div class="card-body p-3 flex-grow-1">
                <h6 class="card-title mb-2">${escapeHtml(b.title)}</h6>
                <p class="card-text small text-muted mb-2">${b.other_links && b.other_links.length? `${b.other_links.length} other link(s)` : ''}</p>
                <div class="d-flex align-items-center gap-2">
                  ${b.pdf ? `<a class="btn btn-sm btn-outline-primary" target="_blank" rel="noopener" href="${b.pdf}">PDF</a>` : ''}
                  ${b.epub ? `<a class="btn btn-sm btn-outline-success" target="_blank" rel="noopener" href="${b.epub}">EPUB</a>` : ''}
                  ${b.other_links && b.other_links.map(l=>`<a class="btn btn-sm btn-outline-secondary" target="_blank" rel="noopener" href="${l}">Link</a>`).join(' ')}
                  <button class="btn btn-sm btn-outline-dark ms-auto copy-link" data-link="${b.pdf||b.epub|| (b.other_links && b.other_links[0]) || ''}">Copy link</button>
                </div>
              </div>
            </div>
          </div>`;

        out.appendChild(col);
      });

      // attach copy handlers
      document.querySelectorAll('.copy-link').forEach(btn => {
        btn.addEventListener('click', async e => {
          const link = e.currentTarget.dataset.link;
          if(!link) return alert('No link available for this book.');
          try{ await navigator.clipboard.writeText(link); e.currentTarget.textContent = 'Copied'; setTimeout(()=>e.currentTarget.textContent='Copy link',1200);}catch(_){ alert('Copy failed.'); }
        });
      });

      renderPagination();
    }

    function renderPagination(){
      const container = document.getElementById('pagination');
      const totalPages = Math.ceil(filtered.length / perPage);
      if(totalPages <= 1){ container.innerHTML = ''; return; }

      const ul = document.createElement('ul'); ul.className = 'pagination';

      const makeBtn = (p, label, disabled=false, active=false) => {
        const li = document.createElement('li'); li.className = 'page-item' + (disabled? ' disabled':'') + (active? ' active':'');
        const a = document.createElement('a'); a.className='page-link'; a.href='#'; a.textContent = label;
        a.addEventListener('click', e => { e.preventDefault(); if(p===currentPage || disabled) return; currentPage = p; render(); });
        li.appendChild(a); return li;
      }

      ul.appendChild(makeBtn(1, '«', currentPage===1));
      for(let p=1;p<=totalPages;p++){
        if(totalPages>9 && Math.abs(p-currentPage)>3 && p!==1 && p!==totalPages) continue;
        ul.appendChild(makeBtn(p, String(p), false, p===currentPage));
      }
      ul.appendChild(makeBtn(totalPages, '»', currentPage===totalPages));

      container.innerHTML = ''; container.appendChild(ul);
    }

    function escapeHtml(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

    async function tryLoadRemote(){
      try{
        const res = await fetch('./books-covers.json?_='+Date.now());
        if(!res.ok) throw new Error('fetch failed');
        const data = await res.json();
        allBooks = ensureCovers(data);
        filtered = allBooks.slice();
        render();
        document.getElementById('stats').textContent = `Loaded ${allBooks.length} books from ./books-covers.json`;
      }catch(err){
        // fallback to embedded
        allBooks = EMBEDDED_BOOKS.slice();
        filtered = allBooks.slice();
        render();
        document.getElementById('stats').textContent = `Using embedded sample (${allBooks.length} books). Use Upload to load your local books.json or serve this folder and reload.`;
      }
    }

    // Ensure each book has a cover attribute (generate placeholder if missing)
    function ensureCovers(list){
      return list.map(b => {
        if(b.cover) return b;
        const t = encodeURIComponent((b.title||'Book').slice(0,60));
        return Object.assign({}, b, { cover: `https://placehold.co/200x300/png?text=${t}&bg=efefef&fc=333333` });
      });
    }

    // File upload support
    document.getElementById('uploadBtn').addEventListener('click', ()=> document.getElementById('fileInput').click());
    document.getElementById('fileInput').addEventListener('change', e => {
      const f = e.target.files[0]; if(!f) return;
      const r = new FileReader(); r.onload = () => {
        try{ const parsed = JSON.parse(r.result); if(!Array.isArray(parsed)) throw new Error('Not an array'); allBooks = ensureCovers(parsed); filtered = allBooks.slice(); document.getElementById('stats').textContent = `Loaded ${allBooks.length} books from uploaded file.`; render(); }catch(err){ alert('Invalid JSON file.'); }
      };
      r.readAsText(f);
      e.target.value = '';
    });

    // Download/export
    document.getElementById('downloadBtn').addEventListener('click', ()=>{
      const data = JSON.stringify(filtered, null, 2);
      const blob = new Blob([data], {type:'application/json'});
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a'); a.href=url; a.download = 'books-export.json'; document.body.appendChild(a); a.click(); a.remove(); URL.revokeObjectURL(url);
    });

    // Search debounce
    let searchTimeout = null;
    document.getElementById('search').addEventListener('input', ()=>{ clearTimeout(searchTimeout); searchTimeout = setTimeout(()=>applyFilters(), 250); });
    document.getElementById('filterPdf').addEventListener('change', applyFilters);
    document.getElementById('filterEpub').addEventListener('change', applyFilters);
    document.getElementById('sort').addEventListener('change', applyFilters);

    // View toggle
    document.querySelectorAll('.view-toggle .btn').forEach(b=>b.addEventListener('click', e=>{
      document.querySelectorAll('.view-toggle .btn').forEach(x=>x.classList.remove('active'));
      e.currentTarget.classList.add('active'); viewMode = e.currentTarget.dataset.view; applyFilters();
    }));

    // Init
    document.addEventListener('DOMContentLoaded', ()=>{ tryLoadRemote(); });
  </script>

steps:
  - name: 'gcr.io/cloud-builders/docker'
    args: ['build', '-t', 'gcr.io/$PROJECT_ID/trading-api:$SHORT_SHA', '.']
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/trading-api:$SHORT_SHA']
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        gcloud run deploy "${_SERVICE:-trading-api}" \
          --image=gcr.io/$PROJECT_ID/trading-api:$SHORT_SHA \
          --region "${_REGION:-us-central1}" \
          --platform managed \
          --allow-unauthenticated
images:
  - 'gcr.io/$PROJECT_ID/trading-api:$SHORT_SHA'
substitutions:
  _SERVICE: trading-api
  _REGION: us-central1
timeout: '1200s'
